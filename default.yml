trigger:
- main

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: BuildJob
    displayName: Build the Application
    steps:
    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/output
        echo "Hello, World!" > $(Build.ArtifactStagingDirectory)/output/hello.txt
      displayName: Generate Files

    - publish: $(Build.ArtifactStagingDirectory)/output
      artifact: drop  # Name of the artifact
      displayName: Publish Build Artifact